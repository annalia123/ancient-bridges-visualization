<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古桥千秋——中国历代桥梁数据可视化</title>
    <!-- 引入 Google Fonts (思源宋体) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- 引入 ECharts -->
    <script src="js/echarts.min.js"></script>
    <style>
        :root {
            --bg-paper: #f2efe6;
            --ink-black: #1a1a1a;
            --cinnabar: #b22c2c;
            --indigo: #2c3e50;
            --gold: #b89f66;
            --border-color: #8c4b31;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', 'SimSun', serif;
            background-color: var(--bg-paper);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0,0,0,0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0,0,0,0.03) 0%, transparent 20%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            color: var(--ink-black);
            line-height: 1.8;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        /* 首页样式 */
        .homepage {
            background-color: var(--bg-paper);
            background-image: url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=ancient%20chinese%20landscape%20painting%20with%20bridges%2C%20traditional%20ink%20style%2C%20misty%20mountains%2C%20classical%20chinese%20painting%20style%2C%20light%20brown%20tones&image_size=square_hd');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--ink-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
        }
        
        /* 确保背景延伸到页面底部 */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .homepage {
            flex: 1;
        }
        
        .homepage::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(242, 239, 230, 0.85);
            z-index: 1;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 2.8rem;
            color: var(--indigo);
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-weight: bold;
            letter-spacing: 3px;
            padding: 15px 0;
            border-bottom: 3px solid var(--cinnabar);
            display: inline-block;
        }
        
        .subtitle {
            font-size: 1.4rem;
            color: var(--border-color);
            margin-bottom: 30px;
            font-style: italic;
            letter-spacing: 2px;
            margin-top: 15px;
        }
        
        .description {
            max-width: 800px;
            margin: 0 auto 40px;
            background: rgba(255,255,255,0.8);
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--cinnabar);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .description p {
            font-size: 1rem;
            color: var(--indigo);
            line-height: 1.6;
            margin: 0;
        }
        
        .modules {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 30px;
        }
        
        .module-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            transition: all 0.3s ease;
            position: relative;
            padding: 20px;
        }
        
        /* 水墨风格装饰背景 */
        .module-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(0,0,0,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0,0,0,0.05) 0%, transparent 40%);
            border-radius: 20px;
            z-index: -1;
            transition: all 0.3s ease;
        }
        
        /* 装饰性水墨边框 */
        .module-container::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(139, 75, 49, 0.2);
            border-radius: 15px;
            pointer-events: none;
        }
        
        .module {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--gold);
            position: relative;
        }
        
        /* 水墨光晕效果 */
        .module::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 3px solid transparent;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 50%, #1a1a1a 100%) padding-box,
                        linear-gradient(135deg, var(--gold) 0%, var(--cinnabar) 100%) border-box;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        /* 悬停时的水墨扩散效果 */
        .module::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(184,159,102,0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }
        
        .module:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }
        
        .module:hover::before {
            opacity: 1;
        }
        
        .module:hover::after {
            width: 200%;
            height: 200%;
        }
        
        .module-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .module:hover .module-image {
            transform: scale(1.15);
        }
        
        .module-title {
            margin-top: 15px;
            color: var(--cinnabar);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 1px;
            position: relative;
            padding: 5px 15px;
        }
        
        /* 标题装饰线 */
        .module-title::before,
        .module-title::after {
            content: '◆';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.5rem;
            color: var(--gold);
        }
        
        .module-title::before {
            left: 0;
        }
        
        .module-title::after {
            right: 0;
        }
        
        .module-description {
            color: var(--indigo);
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: center;
            margin-top: 5px;
            padding: 0 10px;
            position: relative;
        }
        
        /* 模块装饰角标 */
        .module-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            opacity: 0.6;
        }
        
        .module-corner-tl {
            top: 0;
            left: 0;
            border-top: 2px solid var(--gold);
            border-left: 2px solid var(--gold);
        }
        
        .module-corner-tr {
            top: 0;
            right: 0;
            border-top: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
        }
        
        .module-corner-bl {
            bottom: 40px;
            left: 0;
            border-bottom: 2px solid var(--gold);
            border-left: 2px solid var(--gold);
        }
        
        .module-corner-br {
            bottom: 40px;
            right: 0;
            border-bottom: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
        }
        
        /* 水墨散墨效果 */
        .ink-splash {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(ellipse at center, rgba(26,26,26,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .module-container:nth-child(1) .ink-splash { top: 10px; right: 20px; }
        .module-container:nth-child(2) .ink-splash { top: 30px; left: 15px; transform: scale(0.7); }
        .module-container:nth-child(3) .ink-splash { bottom: 50px; right: 10px; transform: scale(0.5); }
        .module-container:nth-child(4) .ink-splash { bottom: 60px; left: 25px; transform: scale(0.8); }
        
        /* 装饰元素 */
        .decorative-line {
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--cinnabar), transparent);
            margin: 30px auto;
        }
        
        /* 故事线链接 */
        .storyline-link {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 3;
        }
        
        .storyline-btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255,255,255,0.9);
            color: var(--cinnabar);
            border: 2px solid var(--cinnabar);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .storyline-btn:hover {
            background: var(--cinnabar);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(178, 44, 44, 0.3);
        }
        
        .storyline-btn i {
            margin-right: 8px;
            animation: bounce 2s infinite;
        }
        
        /* 动画效果 */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-5px);
            }
            60% {
                transform: translateY(-2px);
            }
        }
        
        /* 响应式调整 */
        @media (max-width: 1200px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1.4rem;
            }
            
            .module {
                width: 180px;
                height: 180px;
            }
            
            .module-container {
                width: 200px;
            }
        }
        
        @media (max-width: 992px) {
            h1 {
                font-size: 2.4rem;
            }
            
            .subtitle {
                font-size: 1.3rem;
            }
            
            .module {
                width: 160px;
                height: 160px;
            }
            
            .module-container {
                width: 180px;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .description p {
                font-size: 1rem;
                padding: 0 10px;
            }
            
            .module {
                width: 140px;
                height: 140px;
            }
            
            .module-container {
                width: 160px;
            }
            
            .module-title {
                font-size: 1.1rem;
            }
            
            .module-description {
                font-size: 0.9rem;
            }
            
            .storyline-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- 故事线链接 -->
    <div class="storyline-link">
        <a href="storyline.html" class="storyline-btn">
            <i>📜</i> 了解桥梁历史
        </a>
    </div>
    
    <!-- 首页内容 -->
    <div class="homepage">
        <div class="container">
            <h1>古桥千秋</h1>
            <p class="subtitle">中国历代桥梁数据可视化</p>
            
            <div class="decorative-line"></div>
            
            <div class="description">
                <p>
                    中国古代桥梁是中华民族智慧的结晶，承载着千年历史文化。本可视化项目通过时间、地理位置、类型和装饰四个维度，
                    展现中国1911年之前古桥的发展脉络与艺术价值，带您领略古桥的独特魅力。
                </p>
            </div>
            
            <div class="modules">
                <div class="module-container">
                    <div class="module-corner module-corner-tl"></div>
                    <div class="module-corner module-corner-tr"></div>
                    <div class="module-corner module-corner-bl"></div>
                    <div class="module-corner module-corner-br"></div>
                    <div class="ink-splash"></div>
                    <div class="module" onclick="window.location.href='time.html'">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=ancient%20chinese%20bridge%20through%20time%2C%20traditional%20ink%20painting%2C%20historical%20timeline&image_size=square" alt="时间" class="module-image">
                    </div>
                    <div class="module-title">时间</div>
                    <p class="module-description">探索古桥历史发展脉络</p>
                </div>
                
                <div class="module-container">
                    <div class="module-corner module-corner-tl"></div>
                    <div class="module-corner module-corner-tr"></div>
                    <div class="module-corner module-corner-bl"></div>
                    <div class="module-corner module-corner-br"></div>
                    <div class="ink-splash"></div>
                    <div class="module" onclick="window.location.href='geography.html'">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=ancient%20chinese%20bridge%20geographic%20distribution%2C%20traditional%20map%20style%2C%20rivers%20and%20mountains&image_size=square" alt="地理位置" class="module-image">
                    </div>
                    <div class="module-title">地理位置</div>
                    <p class="module-description">展示不同地区古桥分布</p>
                </div>
                
                <div class="module-container">
                    <div class="module-corner module-corner-tl"></div>
                    <div class="module-corner module-corner-tr"></div>
                    <div class="module-corner module-corner-bl"></div>
                    <div class="module-corner module-corner-br"></div>
                    <div class="ink-splash"></div>
                    <div class="module" onclick="window.location.href='type.html'">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=ancient%20chinese%20bridge%20types%2C%20stone%20arch%20and%20wooden%20bridges%2C%20traditional%20drawing&image_size=square" alt="类型" class="module-image">
                    </div>
                    <div class="module-title">类型</div>
                    <p class="module-description">介绍古桥类型与结构特点</p>
                </div>
                
                <div class="module-container">
                    <div class="module-corner module-corner-tl"></div>
                    <div class="module-corner module-corner-tr"></div>
                    <div class="module-corner module-corner-bl"></div>
                    <div class="module-corner module-corner-br"></div>
                    <div class="ink-splash"></div>
                    <div class="module" onclick="window.location.href='decoration.html'">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=ancient%20chinese%20bridge%20decorations%2C%20stone%20carvings%20and%20ornaments%2C%20traditional%20art&image_size=square" alt="装饰" class="module-image">
                    </div>
                    <div class="module-title">装饰</div>
                    <p class="module-description">欣赏古桥装饰艺术之美</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 添加模块的悬停效果
        const modules = document.querySelectorAll('.module');
        modules.forEach(module => {
            module.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-15px) scale(1.05)';
            });
            module.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
