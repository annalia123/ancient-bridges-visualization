<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国桥梁 · 岁月长河</title>
    <!-- 引入 Google Fonts (思源宋体) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- 引入 ECharts -->
    <script src="js/echarts.min.js"></script>
    <!-- 引入 Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入数据 -->
    <script src="data.js"></script>
    <style>
        :root {
            --bg-paper: #f5f0e6;
            --ink-black: #2c2416;
            --cinnabar: #a52a2a;
            --indigo: #1e3a5f;
            --gold: #c9a959;
            --border-color: #8b7355;
            --light-gold: #e8d5a3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'SimSun', serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            background-image:
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a959' fill-opacity='0.05'%3E%3Cpath d='M30 30l15-15v30L30 30zM30 30L15 15v30l15-15z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                radial-gradient(circle at 10% 20%, rgba(139,115,85,0.08) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(139,115,85,0.08) 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(201,169,89,0.03) 0%, transparent 50%);
            color: var(--ink-black);
            line-height: 1.9;
            overflow-x: hidden;
        }

        /* --- 沉浸式首屏 (Hero Section) --- */
        .hero-section {
            position: relative;
            height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            background:
                linear-gradient(180deg,
                    rgba(245,240,230,0) 0%,
                    rgba(245,240,230,0.85) 100%),
                url('https://images.unsplash.com/photo-1548013146-72479768bada?q=80&w=2076&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            filter: sepia(0.25) contrast(0.95);
        }

        /* 顶部装饰线 */
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--gold) 20%,
                var(--gold) 80%,
                transparent 100%);
        }

        /* 底部装饰线 */
        .hero-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--gold) 20%,
                var(--gold) 80%,
                transparent 100%);
        }

        /* 覆盖层，确保文字清晰 */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                rgba(245,240,230,0.7) 0%,
                rgba(245,240,230,0.85) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        h1 {
            font-size: 4.5rem;
            margin: 0;
            color: var(--ink-black);
            letter-spacing: 20px;
            font-weight: 700;
            text-shadow: 3px 3px 6px rgba(255,255,255,0.8);
            position: relative;
            padding: 0 60px;
        }

        /* 标题装饰 */
        h1::before, h1::after {
            content: '◈';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--gold);
        }
        h1::before { left: 0; }
        h1::after { right: 0; }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--border-color);
            margin-top: 20px;
            letter-spacing: 12px;
            font-weight: 500;
            padding: 12px 30px;
            position: relative;
            display: inline-block;
        }

        /* 副标题装饰线 */
        .hero-subtitle::before, .hero-subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent);
        }
        .hero-subtitle::before { left: -70px; }
        .hero-subtitle::after {
            right: -70px;
            background: linear-gradient(270deg, var(--gold), transparent);
        }

        /* 竖排装饰文字 */
        .vertical-text {
            position: absolute;
            right: 3%;
            top: 20%;
            writing-mode: vertical-rl;
            font-size: 1rem;
            color: rgba(139,115,85,0.3);
            letter-spacing: 15px;
            z-index: 2;
            font-weight: normal;
            display: none;
        }
        @media (min-width: 768px) {
            .vertical-text { display: block; }
        }

        /* --- 导航栏 (Sticky) --- */
        .nav-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(245,240,230,0.98);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(201,169,89,0.3);
            padding: 12px 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            color: var(--border-color);
            position: relative;
            padding: 8px 20px;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .nav-btn::before {
            content: '「';
            position: absolute;
            left: 5px;
            opacity: 0;
            color: var(--gold);
            transition: all 0.3s;
        }
        .nav-btn::after {
            content: '」';
            position: absolute;
            right: 5px;
            opacity: 0;
            color: var(--gold);
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--cinnabar);
            font-weight: bold;
        }

        .nav-btn:hover::before, .nav-btn.active::before,
        .nav-btn:hover::after, .nav-btn.active::after {
            opacity: 1;
        }

        /* --- 主体内容 --- */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px 60px;
            position: relative;
        }

        /* 时间轴容器 */
        .timeline-container {
            position: relative;
            margin-bottom: 60px;
        }

        /* 时间轴线 - 墨线风格 */
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 100px;
            width: 2px;
            background: linear-gradient(180deg,
                var(--gold) 0%,
                rgba(201,169,89,0.3) 50%,
                rgba(201,169,89,0.1) 100%);
            transform: translateX(-50%);
            z-index: 0;
        }

        /* 确保按钮在时间线之上 */
        .view-analysis-section {
            position: relative;
            z-index: 10;
        }

        /* 朝代板块 */
        .dynasty-section {
            margin-bottom: 100px;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            min-height: 400px;
        }

        .dynasty-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 朝代标题 - 印章风格 */
        .dynasty-header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            padding: 20px 40px;
        }
        
        /* 朝代标题装饰边框 */
        .dynasty-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        
        .dynasty-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        
        /* 装饰性水墨散点 */
        .ink-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .ink-decoration-1 { top: -30px; right: 10%; }
        .ink-decoration-2 { bottom: -20px; left: 5%; transform: scale(0.7); }
        .ink-decoration-3 { top: 50%; right: 2%; transform: scale(0.5); }

        .dynasty-title {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, var(--cinnabar), #8b1a1a);
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 12px;
            box-shadow:
                0 6px 20px rgba(165,42,42,0.35),
                inset 0 2px 4px rgba(255,255,255,0.2);
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* 印章边框 */
        .dynasty-title::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
        }

        .dynasty-desc {
            background: linear-gradient(135deg, #fff 0%, #faf8f3 100%);
            padding: 25px 40px;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            font-style: italic;
            color: var(--border-color);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            position: relative;
            border-radius: 4px;
            border: 1px solid rgba(201,169,89,0.2);
        }

        /* 描述框的装饰引号 */
        .dynasty-desc::before {
            content: '"';
            position: absolute;
            top: 5px;
            left: 15px;
            font-size: 50px;
            color: var(--light-gold);
            font-family: Georgia, serif;
            line-height: 1;
        }
        .dynasty-desc::after {
            content: '"';
            position: absolute;
            bottom: -10px;
            right: 15px;
            font-size: 50px;
            color: var(--light-gold);
            font-family: Georgia, serif;
            line-height: 1;
        }

        /* 桥梁卡片网格 */
        .bridge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 35px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 当只有一个桥梁时强制居中 */
        .bridge-grid {}
        .bridge-grid:has(.bridge-card:only-child) {
            display: flex;
            justify-content: center;
        }

        /* 单个桥梁卡片 - 画卷风格 */
        .bridge-card {
            background: linear-gradient(145deg, #fffcf7 0%, #f8f5ee 100%);
            border: none;
            padding: 0;
            position: relative;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            height: 300px;
            width: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 8px;
        }

        /* 卡片顶部装饰条 */
        .bridge-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                var(--gold) 0%,
                var(--cinnabar) 50%,
                var(--gold) 100%);
        }

        /* 卡片边角装饰 */
        .bridge-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, transparent 50%, rgba(201,169,89,0.1) 50%);
        }

        .bridge-card:hover {
            transform: translateY(-10px);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.1),
                0 0 0 1px rgba(201,169,89,0.2);
        }

        .bridge-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--ink-black);
            display: inline-block;
            letter-spacing: 3px;
        }

        /* 桥梁名称行容器 */
        .bridge-name-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin: 20px 25px 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(201,169,89,0.3);
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }

        /* 可点击提示标签 */
        .bridge-media-hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--cinnabar), #8b1a1a);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(165,42,42,0.25);
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .bridge-media-hint:hover {
            transform: scale(1.08);
            box-shadow: 0 5px 15px rgba(165,42,42,0.35);
        }
        .media-icon {
            font-size: 0.9rem;
        }

        .bridge-meta {
            font-size: 0.9rem;
            color: var(--border-color);
            margin: 0 25px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        .bridge-type-tag {
            background: linear-gradient(135deg, var(--indigo), #152a45);
            color: #fff;
            padding: 4px 12px;
            font-size: 0.75rem;
            border-radius: 15px;
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        .bridge-desc {
            font-size: 0.95rem;
            color: #555;
            margin: 0 25px 15px;
            text-align: justify;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.7;
        }

        .bridge-highlight {
            background: linear-gradient(90deg,
                rgba(201,169,89,0.15) 0%,
                rgba(201,169,89,0.05) 100%);
            color: var(--cinnabar);
            padding: 12px 25px;
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
            border-left: 3px solid var(--gold);
            margin-top: auto;
        }

        /* 图表容器 */
        .charts-section {
            margin: 60px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .charts-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--ink-black);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--cinnabar);
        }

        .chart-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e6e0d4;
        }

        .chart-title {
            font-size: 1.2rem;
            color: var(--indigo);
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        .chart {
            width: 100%;
            height: 400px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        /* 底部版权 */
        footer {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 0.9rem;
            border-top: 1px solid #ddd;
            background: rgba(255,255,255,0.5);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 5px; }
            .hero-section { height: 50vh; }
            .timeline-line { left: 20px; }
            .dynasty-header { text-align: left; padding-left: 50px; }
            .dynasty-title { 
                width: 40px; height: 40px; 
                font-size: 1.2rem; 
                position: absolute; left: 0; top: 0;
            }
            .dynasty-desc { text-align: left; margin-left: 0; }
            .bridge-grid { grid-template-columns: 1fr; }
            .grid-container { grid-template-columns: 1fr; }
            .chart { height: 300px; }
        }
        
        /* 媒体模态框 */
        .media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .media-modal.active {
            display: flex;
        }
        
        .media-container {
            position: relative;
            width: 90%;
            height: 90%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .media-content {
            flex: 1;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
            z-index: 1;
        }
        
        /* 标签页导航 */
        .media-tabs {
            display: flex;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        
        .media-tab {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .media-tab:hover {
            color: #fff;
        }
        
        .media-tab.active {
            color: white;
            border-bottom: 3px solid var(--cinnabar);
        }
        
        .media-content {
            flex: 1;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
        }
        
        .media-content.active {
            display: flex;
        }
        
        /* 3D模型区域 */
        .model-canvas {
            width: 100%;
            height: 100%;
        }

        /* 加载中转圈效果 */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 4px solid rgba(139, 69, 19, 0.2);
            border-top-color: #8B4513;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        .loading-spinner::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 3px solid rgba(139, 69, 19, 0.15);
            border-bottom-color: #A0522D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite reverse;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .loading-text {
            position: absolute;
            top: calc(50% + 45px);
            left: 50%;
            transform: translateX(-50%);
            color: #8B4513;
            font-size: 14px;
            white-space: nowrap;
        }

        /* 图片画廊 */
        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        
        .gallery-image {
            max-width: 45%;
            max-height: 80%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .gallery-image:hover {
            transform: scale(1.05);
        }
        
        /* 图片预览模态框 */
        .image-preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 1100;
            justify-content: center;
            align-items: center;
        }
        
        .image-preview-modal.active {
            display: flex;
        }
        
        .preview-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        
        .media-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--cinnabar);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s;
        }
        
        .media-close:hover {
            transform: scale(1.1);
        }
        
        .media-header {
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
        }
        
        .media-title {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;

<script>


    // 1. 朝代技术背景描述
    const dynastyContext = {
        "春秋": "【木石初兴】早期桥梁多以木梁为主，结构简单，注重实用性与礼仪象征。",
        "晋": "【石拱萌芽】开始出现有明确记载的石拱桥，石材加工技术初步应用于桥梁建设。",
        "隋": "【敞肩奇迹】赵州桥问世，首创敞肩拱结构，是世界桥梁史上的重大突破，减轻自重且利于排洪。",
        "唐": "【多元发展】石拱桥技术成熟，出现多孔联拱桥（宝带桥）和大型浮桥（蒲津渡），桥梁与文化诗词紧密结合。",
        "北宋": "【结构创新】编梁木拱桥（虹桥）达到顶峰，无柱支撑跨越河流，适应繁忙漕运；同时开始探索跨海桥梁。",
        "宋": "【跨海壮举】福建地区首创筏型基础（洛阳桥）和种蛎固基法，建成安平桥等超长跨海石梁桥，工程技术世界领先。",
        "金": "【继承发扬】继承宋代石拱技术，卢沟桥成为联拱石桥的杰作，石雕艺术达到极高水准。",
        "元": "【运河枢纽】随着大运河全线贯通，桥梁服务于漕运，万宁桥成为大都中轴线的重要节点。",
        "明": "【装饰巅峰】桥梁结构趋于稳定，重点转向装饰艺术。桥墩瑞兽雕刻（龙脑桥）、桥屋结合（廊桥）盛行。",
        "清": "【集大成者】园林桥梁（五亭桥、十七孔桥）达到美学巅峰；西南山区木拱廊桥和铁索桥（泸定桥）技术成熟。"
    };



    // 2. 初始化
    function init() {
        renderNav();
        renderTimeline();
        setupScrollObserver();
        initCharts();
    }

    // 渲染导航
    function renderNav() {
        const dynasties = [...new Set(bridgeData.map(b => b.dynasty))].filter(d => d !== '民国');
        const order = ["春秋", "晋", "隋", "唐", "北宋", "宋", "金", "元", "明", "清"];
        dynasties.sort((a, b) => order.indexOf(a) - order.indexOf(b));

        const navBar = document.getElementById('nav-bar');
        
        // 全部按钮
        const allBtn = document.createElement('button');
        allBtn.className = 'nav-btn active';
        allBtn.innerText = '纵观古今';
        allBtn.onclick = () => filterDynasty('all', allBtn);
        navBar.appendChild(allBtn);

        // 朝代按钮
        dynasties.forEach(d => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = d;
            btn.onclick = () => filterDynasty(d, btn);
            navBar.appendChild(btn);
        });

        // 添加返回首页链接
        const homeBtn = document.createElement('a');
        homeBtn.className = 'nav-btn';
        homeBtn.innerText = '返回首页';
        homeBtn.href = 'index.html';
        homeBtn.style.textDecoration = 'none';
        navBar.appendChild(homeBtn);
    }

    // 渲染时间轴内容
    function renderTimeline() {
        const container = document.getElementById('timeline-content');
        const dynasties = [...new Set(bridgeData.map(b => b.dynasty))];
        const order = ["春秋", "晋", "隋", "唐", "北宋", "宋", "金", "元", "明", "清"];
        dynasties.sort((a, b) => order.indexOf(a) - order.indexOf(b));

        // 有3D模型或图片的桥梁列表
        const bridgesWithMedia = {
            '灞桥': true, '万宁桥': true, '五亭桥': true, '八字桥': true, '北涧桥': true, '十七孔桥': true, '卢沟桥': true, 
            '双龙桥': true, '太平桥': true, '安平桥': true, '安济桥': true, '安澜桥': true, '崇庆桥': true, '广济桥': true, 
            '放生桥': true, '普济桥': true, '毓秀桥': true, '永安桥': true, '永通桥': true, '江东桥': true, '泸定桥': true, '洛阳桥': true, 
            '清名桥': true, '溪东桥': true, '灞陵桥': true, '百梁桥': true, '迎祥桥': true, '金莲桥': true, '长虹桥': true, 
            '鸾峰桥': true, '龙江桥': true, '龙脑桥': true, '旅人桥': true, '小商桥': true, '弘济桥': true, '赵州桥': true, 
            '断桥': true, '枫桥': true, '升仙桥': true, '蒲津渡浮桥': true, '宝带桥': true, '虹桥': true, '信量桥': true, '彰善桥': true
        };

        dynasties.forEach(dynasty => {
            const section = document.createElement('div');
            section.className = 'dynasty-section';
            section.id = `dynasty-${dynasty}`;
            section.dataset.dynasty = dynasty;

            // 获取该朝代桥梁，排除程阳永济桥
            const bridges = bridgeData.filter(b => b.dynasty === dynasty && b.name !== '程阳永济桥');
            
            // 构建 HTML
            let bridgesHtml = '';
            bridges.forEach(bridge => {
                const hasMedia = bridgesWithMedia[bridge.name] === true;
                const clickableClass = hasMedia ? 'clickable' : '';
                bridgesHtml += `
                    <div class="bridge-card ${clickableClass}" ${hasMedia ? `data-bridge="${bridge.name}"` : ''}>
                        <div class="bridge-name-row">
                            <div class="bridge-name">${bridge.name}</div>
                            ${hasMedia ? '<div class="bridge-media-hint"><span class="media-icon">📷</span><span>3D模型/图片</span></div>' : ''}
                        </div>
                        <div class="bridge-meta">
                            <span>${bridge.location}</span>
                            <span class="bridge-type-tag">${bridge.type}</span>
                        </div>
                        <div class="bridge-desc">${bridge.desc}</div>
                        <div class="bridge-highlight">★ ${bridge.highlight}</div>
                    </div>
                `;
            });

            section.innerHTML = `
                <div class="dynasty-header">
                    <div class="dynasty-title">${dynasty}</div>
                    <div class="dynasty-desc">${dynastyContext[dynasty] || ''}</div>
                </div>
                <div class="bridge-grid">
                    ${bridgesHtml}
                </div>
            `;
            container.appendChild(section);
        });
    }

    // 筛选功能
    function filterDynasty(dynasty, btnElement) {
        // 更新按钮状态
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        // 显示/隐藏板块
        const sections = document.querySelectorAll('.dynasty-section');
        sections.forEach(section => {
            if (dynasty === 'all' || section.dataset.dynasty === dynasty) {
                section.style.display = 'block';
                // 重新触发动画
                setTimeout(() => section.classList.add('visible'), 50);
            } else {
                section.style.display = 'none';
                section.classList.remove('visible');
            }
        });
    }

    // 滚动监听动画
    function setupScrollObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.dynasty-section').forEach(section => {
            observer.observe(section);
        });
    }

    // 初始化图表
    function initCharts() {
        // 1. 时间轴图表
        const timeChartElement = document.getElementById('time-chart');
        if (timeChartElement) {
            const timeChart = echarts.init(timeChartElement);
            
            // 统计各朝代桥梁数量
            const dynastyCount = {};
            bridgeData.forEach(bridge => {
                if (dynastyCount[bridge.dynasty]) {
                    dynastyCount[bridge.dynasty]++;
                } else {
                    dynastyCount[bridge.dynasty] = 1;
                }
            });
            
            // 按时间顺序排序朝代
            const dynastiesOrder = ['春秋', '晋', '隋', '唐', '北宋', '宋', '金', '元', '明', '清'];
            const sortedDynasties = dynastiesOrder.filter(dynasty => dynastyCount[dynasty]);
            const counts = sortedDynasties.map(dynasty => dynastyCount[dynasty]);
            
            const timeOption = {
                title: {
                    text: '中国古代桥梁朝代分布',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: sortedDynasties,
                    axisLabel: {
                        interval: 0,
                        rotate: 45
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '桥梁数量'
                },
                series: [{
                    data: counts,
                    type: 'bar',
                    itemStyle: {
                        color: '#b22c2c'
                    }
                }]
            };
            
            timeChart.setOption(timeOption);
            
            // 2. 桥梁类型时间趋势
            const typeTrendChartElement = document.getElementById('type-trend-chart');
            if (typeTrendChartElement) {
                const typeTrendChart = echarts.init(typeTrendChartElement);
                
                // 按朝代和类型统计
                const typeByDynasty = {};
                bridgeData.forEach(bridge => {
                    if (!typeByDynasty[bridge.dynasty]) {
                        typeByDynasty[bridge.dynasty] = {};
                    }
                    if (typeByDynasty[bridge.dynasty][bridge.type]) {
                        typeByDynasty[bridge.dynasty][bridge.type]++;
                    } else {
                        typeByDynasty[bridge.dynasty][bridge.type] = 1;
                    }
                });
                
                // 获取所有类型
                const allTypes = [...new Set(bridgeData.map(bridge => bridge.type))];
                
                // 构建系列数据
                const series = allTypes.map(type => {
                    return {
                        name: type,
                        type: 'line',
                        data: sortedDynasties.map(dynasty => {
                            return typeByDynasty[dynasty]?.[type] || 0;
                        })
                    };
                });
                
                const typeTrendOption = {
                    title: {
                        text: '各类型桥梁时间分布',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'axis'
                    },
                    legend: {
                        data: allTypes,
                        orient: 'vertical',
                        left: 'left'
                    },
                    xAxis: {
                        type: 'category',
                        data: sortedDynasties
                    },
                    yAxis: {
                        type: 'value',
                        name: '桥梁数量'
                    },
                    series: series
                };
                
                typeTrendChart.setOption(typeTrendOption);
                
                // 3. 桥梁建造年代分布
                const yearDistributionChartElement = document.getElementById('year-distribution-chart');
                if (yearDistributionChartElement) {
                    const yearDistributionChart = echarts.init(yearDistributionChartElement);
                    
                    // 按年代分组
                    const yearGroups = {
                        '先秦': 0,
                        '秦汉': 0,
                        '魏晋南北朝': 0,
                        '隋唐': 0,
                        '宋元': 0,
                        '明清': 0
                    };
                    
                    bridgeData.forEach(bridge => {
                        const year = bridge.startYear;
                        if (year < -221) {
                            yearGroups['先秦']++;
                        } else if (year >= -221 && year < 220) {
                            yearGroups['秦汉']++;
                        } else if (year >= 220 && year < 581) {
                            yearGroups['魏晋南北朝']++;
                        } else if (year >= 581 && year < 960) {
                            yearGroups['隋唐']++;
                        } else if (year >= 960 && year < 1368) {
                            yearGroups['宋元']++;
                        } else if (year >= 1368 && year < 1912) {
                            yearGroups['明清']++;
                        }
                    });
                    
                    const yearGroupsData = Object.entries(yearGroups).map(([name, value]) => ({
                        name,
                        value
                    }));
                    
                    const yearDistributionOption = {
                        title: {
                            text: '桥梁建造年代分布',
                            left: 'center'
                        },
                        tooltip: {
                            trigger: 'item',
                            formatter: '{b}: {c} ({d}%)'
                        },
                        series: [{
                            name: '年代分布',
                            type: 'pie',
                            radius: '60%',
                            data: yearGroupsData,
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                                }
                            }
                        }]
                    };
                    
                    yearDistributionChart.setOption(yearDistributionOption);
                    
                    // 响应式调整
                    window.addEventListener('resize', function() {
                        timeChart.resize();
                        typeTrendChart.resize();
                        yearDistributionChart.resize();
                    });
                }
            }
        }
    }



    // 3D模型相关变量
    let scene, camera, renderer, controls, model;
    
    // 初始化3D模型场景
    function init3DScene() {
        const canvas = document.getElementById('model-canvas');
        const container = canvas.parentElement;
        
        // 创建场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        // 创建相机
        const aspect = container.clientWidth / container.clientHeight;
        camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
        camera.position.set(5, 3, 5);
        
        // 创建渲染器
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // 添加光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);
        
        // 添加轨道控制器
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // 窗口大小调整
        window.addEventListener('resize', function() {
            if (scene && camera && renderer) {
                const modelContent = document.getElementById('model-content');
                camera.aspect = modelContent.clientWidth / modelContent.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(modelContent.clientWidth, modelContent.clientHeight);
            }
        });
    }
    
    // 加载3D模型
    function loadModel(bridgeName) {
        // 清除旧模型
        if (model) {
            scene.remove(model);
        }

        // 显示加载中
        const loadingSpinner = document.getElementById('model-loading');
        const loadingText = document.getElementById('model-loading-text');
        if (loadingSpinner) loadingSpinner.style.display = 'block';
        if (loadingText) {
            loadingText.style.display = 'block';
            loadingText.textContent = '正在加载...';
        }

        // 定义桥梁名称到glb文件名的映射
        const modelNameMap = {
            '旅人桥': '1.旅人桥.glb',
            '小商桥': '2.小商桥.glb',
            '弘济桥': '3.弘济桥.glb',
            '断桥': '4.断桥.glb',
            '枫桥': '5.枫桥.glb',
            '升仙桥': '6.升仙桥.glb',
            '蒲津渡浮桥': '7. 蒲津渡浮桥.glb',
            '宝带桥': '8.宝带桥.glb',
            '虹桥': '9.虹桥.glb',
            '信量桥': '10.信量桥.glb',
            '彰善桥': '11.彰善桥.glb'
        };

        // 获取模型路径
        let modelPath;
        if (bridgeName === '旅人桥') {
            modelPath = 'glb/1.旅人桥.glb';
        } else {
            const modelFileName = modelNameMap[bridgeName] || `${bridgeName}.glb`;
            modelPath = `glb/${modelFileName}`;
        }

        console.log('尝试加载模型:', bridgeName, '路径:', modelPath);

        // 创建加载器
        const loader = new THREE.GLTFLoader();
        
        // 添加DRACOLoader支持
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/libs/draco/');
        loader.setDRACOLoader(dracoLoader);
        
        // 尝试加载模型
        loader.load(
            modelPath,
            function (gltf) {
                console.log('模型加载成功:', bridgeName);
                model = gltf.scene;

                // 调整模型大小和位置
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // 居中并缩放模型
                model.position.sub(center);
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 5 / maxDim;
                model.scale.multiplyScalar(scale);

                scene.add(model);

                // 隐藏加载中
                if (loadingSpinner) loadingSpinner.style.display = 'none';
                if (loadingText) loadingText.style.display = 'none';
            },
            function (xhr) {
                if (xhr.lengthComputable && loadingText) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingText.textContent = `加载中... ${percent}%`;
                }
            },
            function (error) {
                console.error('模型加载失败:', bridgeName, error);
                createDefaultBridgeModel();
                if (loadingSpinner) loadingSpinner.style.display = 'none';
                if (loadingText) {
                    loadingText.textContent = '使用默认模型';
                    setTimeout(() => { loadingText.style.display = 'none'; }, 1500);
                }
            }
        );
    }
    
    // 创建默认的桥梁3D模型
    function createDefaultBridgeModel() {
        // 清除旧模型
        if (model) {
            scene.remove(model);
        }
        
        // 创建一个简单的桥梁模型
        const bridgeGroup = new THREE.Group();
        
        // 创建桥墩
        const pierGeometry = new THREE.BoxGeometry(1, 2, 3);
        const pierMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
        
        const pier1 = new THREE.Mesh(pierGeometry, pierMaterial);
        pier1.position.set(-2, -1, 0);
        bridgeGroup.add(pier1);
        
        const pier2 = new THREE.Mesh(pierGeometry, pierMaterial);
        pier2.position.set(2, -1, 0);
        bridgeGroup.add(pier2);
        
        // 创建桥面
        const deckGeometry = new THREE.BoxGeometry(6, 0.5, 3);
        const deckMaterial = new THREE.MeshPhongMaterial({ color: 0xA0522D });
        const deck = new THREE.Mesh(deckGeometry, deckMaterial);
        deck.position.set(0, 0.75, 0);
        bridgeGroup.add(deck);
        
        // 创建栏杆
        const railGeometry = new THREE.BoxGeometry(0.1, 1, 3);
        const railMaterial = new THREE.MeshPhongMaterial({ color: 0xCD853F });
        
        const rail1 = new THREE.Mesh(railGeometry, railMaterial);
        rail1.position.set(-2.9, 1, 0);
        bridgeGroup.add(rail1);
        
        const rail2 = new THREE.Mesh(railGeometry, railMaterial);
        rail2.position.set(2.9, 1, 0);
        bridgeGroup.add(rail2);
        
        // 调整模型大小和位置
        bridgeGroup.scale.multiplyScalar(0.8);
        
        model = bridgeGroup;
        scene.add(model);
        
        // 显示模型加载提示
        const modelContent = document.getElementById('model-content');
        if (modelContent) {
            // 清除之前的提示
            const existingPrompt = modelContent.querySelector('div');
            if (existingPrompt) {
                existingPrompt.remove();
            }
        }
    }
    
    // 切换标签页
    function switchTab(tabName) {
        // 更新标签页按钮状态
        document.querySelectorAll('.media-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelector(`.media-tab[data-tab="${tabName}"]`).classList.add('active');
        
        // 切换内容
        document.querySelectorAll('.media-content').forEach(content => {
            content.classList.remove('active');
        });
        document.getElementById(`${tabName}-content`).classList.add('active');
        
        // 如果切换到模型标签，初始化场景并调整大小
        if (tabName === 'model') {
            if (!scene) {
                setTimeout(init3DScene, 100);
            } else if (camera && renderer) {
                const modelContent = document.getElementById('model-content');
                camera.aspect = modelContent.clientWidth / modelContent.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(modelContent.clientWidth, modelContent.clientHeight);
            }
        }
    }

    // 显示媒体模态框
    function showMediaModal(bridgeName) {
        const modal = document.getElementById('media-modal');
        const title = document.getElementById('media-title');
        const location = document.getElementById('media-location');
        
        title.textContent = bridgeName;
        
        // 查找桥梁的位置信息
        const bridge = bridgeData.find(b => b.name === bridgeName);
        if (bridge) {
            location.textContent = bridge.location;
        } else {
            location.textContent = '';
        }
        
        modal.classList.add('active');
        
        // 默认显示3D模型标签
        switchTab('model');
        
        // 初始化场景（如果还没初始化）
        if (!scene) {
            setTimeout(init3DScene, 100);
        }
        
        // 加载模型
        loadModel(bridgeName);
        
        // 生成图片画廊
        generateImageGallery(bridgeName);
    }
    
    // 关闭媒体模态框
    function closeMediaModal() {
        const modal = document.getElementById('media-modal');
        modal.classList.remove('active');
    }
    
    // 图片预览相关变量
    let scale = 1;
    let isDragging = false;
    let startX, startY;
    let translateX = 0;
    let translateY = 0;
    
    // 显示图片预览
    function showImagePreview(imageSrc) {
        const modal = document.getElementById('image-preview-modal');
        const previewImage = document.getElementById('preview-image');
        
        // 重置缩放和位置
        scale = 1;
        translateX = 0;
        translateY = 0;
        updateImageTransform(previewImage);
        
        previewImage.src = imageSrc;
        modal.classList.add('active');
    }
    
    // 关闭图片预览
    function closeImagePreview() {
        const modal = document.getElementById('image-preview-modal');
        modal.classList.remove('active');
        
        // 重置变量
        scale = 1;
        translateX = 0;
        translateY = 0;
        isDragging = false;
    }
    
    // 更新图片变换
    function updateImageTransform(image) {
        image.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
    }
    
    // 图片缩放功能
    function setupImageZoom() {
        const previewImage = document.getElementById('preview-image');
        
        // 鼠标滚轮缩放
        previewImage.addEventListener('wheel', function(e) {
            e.preventDefault();
            
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const rect = this.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const oldScale = scale;
            scale = Math.max(0.1, Math.min(5, scale * delta));
            
            // 调整位置，使缩放中心在鼠标位置
            translateX += (mouseX / oldScale) * (1 - oldScale / scale);
            translateY += (mouseY / oldScale) * (1 - oldScale / scale);
            
            updateImageTransform(this);
        });
        
        // 鼠标按下开始拖拽
        previewImage.addEventListener('mousedown', function(e) {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });
        
        // 鼠标移动拖拽
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            
            updateImageTransform(previewImage);
        });
        
        // 鼠标释放结束拖拽
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 双击重置缩放
        previewImage.addEventListener('dblclick', function() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateImageTransform(this);
        });
    }
    
    // 设置点击事件
    function setupMediaEvents() {
        // 标签页切换
        document.querySelectorAll('.media-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                switchTab(tabName);
            });
        });
        
        // 关闭媒体模态框
        document.getElementById('media-close').addEventListener('click', closeMediaModal);
        
        // 点击媒体模态框外部关闭
        document.getElementById('media-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMediaModal();
            }
        });
        
        // 图片预览功能通过事件委托实现
        document.getElementById('image-gallery').addEventListener('click', function(e) {
            const image = e.target.closest('.gallery-image');
            if (image) {
                const fullSrc = image.getAttribute('data-full');
                showImagePreview(fullSrc);
            }
        });
        
        // 关闭图片预览
        document.getElementById('preview-close').addEventListener('click', closeImagePreview);
        
        // 点击图片预览外部关闭
        document.getElementById('image-preview-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeImagePreview();
            }
        });
        
        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImagePreview();
                closeMediaModal();
            }
        });
        
        // 桥梁卡片点击事件
        document.addEventListener('click', function(e) {
            const card = e.target.closest('.bridge-card[data-bridge]');
            if (card) {
                const bridgeName = card.getAttribute('data-bridge');
                showMediaModal(bridgeName);
            }
        });
    }
    
    // 启动
    init();
    setupMediaEvents();
    setupImageZoom();

</script>
